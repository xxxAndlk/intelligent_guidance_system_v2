syntax = "proto3";

package api.ai.v1;

option go_package = "intelligent-guidance-system/api/ai/v1;v1";

import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

// 通用错误码
enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;
    
    // 通用错误 1-99
    ERROR_CODE_INVALID_REQUEST = 1;
    ERROR_CODE_UNAUTHORIZED = 2;
    ERROR_CODE_FORBIDDEN = 3;
    ERROR_CODE_NOT_FOUND = 4;
    ERROR_CODE_ALREADY_EXISTS = 5;
    ERROR_CODE_RATE_LIMITED = 6;
    ERROR_CODE_INTERNAL_ERROR = 7;
    ERROR_CODE_SERVICE_UNAVAILABLE = 8;
    ERROR_CODE_TIMEOUT = 9;
    ERROR_CODE_INVALID_ARGUMENT = 10;
    
    // 会话相关错误 100-199
    ERROR_CODE_SESSION_NOT_FOUND = 100;
    ERROR_CODE_SESSION_EXPIRED = 101;
    ERROR_CODE_SESSION_ALREADY_COMPLETED = 102;
    ERROR_CODE_SESSION_STATUS_INVALID = 103;
    ERROR_CODE_SESSION_CREATION_FAILED = 104;
    
    // 诊断相关错误 200-299
    ERROR_CODE_SYMPTOM_INVALID = 200;
    ERROR_CODE_SYMPTOM_DUPLICATE = 201;
    ERROR_CODE_DIAGNOSIS_FAILED = 202;
    ERROR_CODE_RECOMMENDATION_FAILED = 203;
    ERROR_CODE_ANALYSIS_TIMEOUT = 204;
    ERROR_CODE_MODEL_UNAVAILABLE = 205;
    ERROR_CODE_INVALID_SEVERITY = 206;
    
    // RAG相关错误 300-399
    ERROR_CODE_INDEX_NOT_FOUND = 300;
    ERROR_CODE_INDEXING_FAILED = 301;
    ERROR_CODE_SEARCH_FAILED = 302;
    ERROR_CODE_EMBEDDING_FAILED = 303;
    ERROR_CODE_DOCUMENT_NOT_FOUND = 304;
    ERROR_CODE_BATCH_SIZE_EXCEEDED = 305;
    ERROR_CODE_VECTOR_DIMENSION_MISMATCH = 306;
    
    // 数据验证错误 400-499
    ERROR_CODE_VALIDATION_FAILED = 400;
    ERROR_CODE_REQUIRED_FIELD_MISSING = 401;
    ERROR_CODE_FIELD_VALUE_INVALID = 402;
    ERROR_CODE_FIELD_VALUE_OUT_OF_RANGE = 403;
    ERROR_CODE_FIELD_FORMAT_INVALID = 404;
    
    // 用户相关错误 500-599
    ERROR_CODE_USER_NOT_FOUND = 500;
    ERROR_CODE_USER_BLOCKED = 501;
    ERROR_CODE_USER_QUOTA_EXCEEDED = 502;
    ERROR_CODE_USER_PERMISSION_DENIED = 503;
    
    // 数据相关错误 600-699
    ERROR_CODE_DATA_NOT_FOUND = 600;
    ERROR_CODE_DATA_CORRUPTED = 601;
    ERROR_CODE_DATA_VERSION_MISMATCH = 602;
    ERROR_CODE_DATA_INTEGRITY_VIOLATION = 603;
}

// 错误详情
message ErrorDetail {
    // 错误码
    ErrorCode code = 1;
    // 错误消息
    string message = 2;
    // 详细描述
    string description = 3;
    // 错误字段路径
    string field = 4;
    // 错误值
    string value = 5;
    // 帮助链接
    string help_url = 6;
}

// 错误响应
message ErrorResponse {
    // 错误码
    ErrorCode code = 1;
    // 错误消息
    string message = 2;
    // 错误详情列表
    repeated ErrorDetail details = 3;
    // 请求ID
    string request_id = 4;
    // 时间戳
    google.protobuf.Timestamp timestamp = 5;
    // 重试建议
    RetryInfo retry_info = 6;
}

// 重试信息
message RetryInfo {
    // 是否可重试
    bool retryable = 1;
    // 建议等待时间(秒)
    int32 retry_after_seconds = 2;
    // 最大重试次数
    int32 max_retries = 3;
}

// 分页请求
message PageRequest {
    // 页码(从1开始)
    int32 page = 1 [(validate.rules).int32 = {gte: 1}];
    // 每页数量
    int32 page_size = 2 [(validate.rules).int32 = {gte: 1, lte: 100}];
    // 排序字段
    string sort_by = 3;
    // 是否降序
    bool desc = 4;
}

// 分页响应
message PageResponse {
    // 总数
    int64 total = 1;
    // 当前页
    int32 page = 2;
    // 每页数量
    int32 page_size = 3;
    // 总页数
    int32 total_pages = 4;
    // 是否有下一页
    bool has_next = 5;
}

// 时间范围
message TimeRange {
    // 开始时间
    google.protobuf.Timestamp start_time = 1;
    // 结束时间
    google.protobuf.Timestamp end_time = 2;
}

// 排序选项
message SortOption {
    // 排序字段
    string field = 1;
    // 是否升序
    bool ascending = 2;
}

// 元数据
message Metadata {
    // 创建者
    string created_by = 1;
    // 创建时间
    google.protobuf.Timestamp created_at = 2;
    // 更新者
    string updated_by = 3;
    // 更新时间
    google.protobuf.Timestamp updated_at = 4;
    // 版本
    int64 version = 5;
    // 扩展字段
    map<string, string> extensions = 6;
}

// 操作结果
message OperationResult {
    // 是否成功
    bool success = 1;
    // 错误信息
    ErrorResponse error = 2;
    // 影响的记录数
    int64 affected_count = 3;
    // 操作消息
    string message = 4;
}

// 健康检查响应
message HealthCheckResponse {
    // 服务状态
    ServiceStatus status = 1;
    // 服务名称
    string service_name = 2;
    // 版本
    string version = 3;
    // 运行时间(秒)
    int64 uptime_seconds = 4;
    // 组件状态
    map<string, ComponentHealth> components = 5;
    // 检查时间
    google.protobuf.Timestamp checked_at = 6;
}

// 服务状态枚举
enum ServiceStatus {
    SERVICE_STATUS_UNSPECIFIED = 0;
    SERVICE_STATUS_HEALTHY = 1;
    SERVICE_STATUS_DEGRADED = 2;
    SERVICE_STATUS_UNHEALTHY = 3;
}

// 组件健康状态
message ComponentHealth {
    // 状态
    ServiceStatus status = 1;
    // 消息
    string message = 2;
    // 详情
    map<string, string> details = 3;
}