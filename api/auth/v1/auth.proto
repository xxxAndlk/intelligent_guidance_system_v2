syntax = "proto3";

package api.auth.v1;

option go_package = "intelligent_guidance_system_v2/api/auth/v1;v1";

// UserType 用户类型枚举
enum UserType {
  USER_TYPE_UNSPECIFIED = 0;
  USER_TYPE_PATIENT = 1;
  USER_TYPE_DOCTOR = 2;
  USER_TYPE_ADMIN = 3;
}

// DataScope 数据权限范围枚举
enum DataScope {
  DATA_SCOPE_UNSPECIFIED = 0;
  DATA_SCOPE_ALL = 1;          // 全部数据权限
  DATA_SCOPE_DEPT = 2;         // 本部门数据权限
  DATA_SCOPE_DEPT_AND_SUB = 3; // 本部门及子部门数据权限
  DATA_SCOPE_OWN = 4;          // 仅本人数据权限
}

// AuthService 认证服务
service AuthService {
  // Login 用户登录
  rpc Login(LoginRequest) returns (LoginResponse);
  // Logout 用户登出
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // RefreshToken 刷新访问令牌
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // GetUserInfo 获取当前用户信息
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);
  // UpdatePassword 更新用户密码
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse);
  // CheckPermission 检查用户权限
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
}

// User 用户信息
message User {
  int64 id = 1;
  UserType user_type = 2;
  string username = 3;
  string real_name = 4;
  string phone = 5;
  string email = 6;
  string avatar = 7;
  int32 status = 8;
  repeated Role roles = 9;
}

// Role 角色信息
message Role {
  int64 id = 1;
  string code = 2;
  string name = 3;
  DataScope data_scope = 4;
  repeated Permission permissions = 5;
}

// Permission 权限信息
message Permission {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string resource_type = 4;
  string resource_url = 5;
}

// DataPermission 数据权限
message DataPermission {
  string resource_type = 1;
  DataScope data_scope = 2;
  repeated int64 dept_ids = 3;
}

// LoginRequest 登录请求
message LoginRequest {
  string username = 1;
  string password = 2;
}

// LoginResponse 登录响应
message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  User user = 4;
}

// LogoutRequest 登出请求
message LogoutRequest {}

// LogoutResponse 登出响应
message LogoutResponse {}

// RefreshTokenRequest 刷新令牌请求
message RefreshTokenRequest {
  string refresh_token = 1;
}

// RefreshTokenResponse 刷新令牌响应
message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

// GetUserInfoRequest 获取用户信息请求
message GetUserInfoRequest {}

// GetUserInfoResponse 获取用户信息响应
message GetUserInfoResponse {
  User user = 1;
  repeated DataPermission data_permissions = 2;
}

// UpdatePasswordRequest 更新密码请求
message UpdatePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

// UpdatePasswordResponse 更新密码响应
message UpdatePasswordResponse {}

// CheckPermissionRequest 检查权限请求
message CheckPermissionRequest {
  string permission_code = 1;
  string resource_type = 2;
  string resource_url = 3;
}

// CheckPermissionResponse 检查权限响应
message CheckPermissionResponse {
  bool has_permission = 1;
}