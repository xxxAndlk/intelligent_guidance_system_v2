syntax = "proto3";

package common.v1;

option go_package = "intelligent_guidance_system_v2/api/common/v1;commonv1";

// ErrorCode enum for standardized error codes
enum ErrorCode {
  OK = 0;
  INVALID_ARGUMENT = 400;
  UNAUTHORIZED = 401;
  FORBIDDEN = 403;
  NOT_FOUND = 404;
  ALREADY_EXISTS = 409;
  INTERNAL_ERROR = 500;
  SERVICE_UNAVAILABLE = 503;
}