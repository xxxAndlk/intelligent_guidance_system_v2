bind 0.0.0.0
port 6379
protected-mode no

daemonize no
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile ""

# 持久化配置
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 内存配置
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# 连接配置
timeout 0
tcp-keepalive 300
tcp-backlog 511
maxclients 10000

# 性能优化
hz 10
dynamic-hz yes

# 线程配置
io-threads 4
io-threads-do-reads yes

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128
